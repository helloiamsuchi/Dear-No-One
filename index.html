<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dear No One — Write the Letter</title>
<meta name="description" content="Write a letter to no one in particular. Seal it with wax and let it go.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Reusable icon sprite (kept out of tab order / not rendered directly) -->
<svg class="visually-hidden" aria-hidden="true">
  <symbol id="icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="13 6 19 12 13 18"></polyline></symbol>
  <symbol id="icon-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></symbol>
  <symbol id="icon-quill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></symbol>
  <symbol id="icon-seal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 14.4 7.2 16.9l.9-5.4L4.2 7.7l5.4-.8L12 2z"></path></symbol>
</svg>

<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="index.html">Dear No One</a>
    <nav class="tab-nav" aria-label="Site sections">
      <a href="index.html" class="tab-nav__item is-active" aria-current="page">Write the Letter</a>
      <a href="read.html" class="tab-nav__item">Read the Letter</a>
    </nav>
  </div>
</header>

<main class="page-main">
  <div class="page-title-row">
    <h1>A letter to No One</h1>
  </div>

  <section class="surface-card" aria-labelledby="form-heading">
    <h2 id="form-heading" class="visually-hidden">Write your letter</h2>
    <div class="surface-card__accent"></div>
    <div class="surface-card__body">

      <div class="field-row">
        <div class="field field--to">
          <label for="letter-to">
            <span class="label-text"><svg aria-hidden="true"><use href="#icon-arrow"></use></svg>To</span>
            <span class="req" aria-hidden="true">*</span>
          </label>
          <input id="letter-to" type="text" placeholder="The Moon, Yesterday, My 18-year-old self, No One…" maxlength="80" autocomplete="off" required aria-required="true">
        </div>
        <div class="field field--from">
          <label for="letter-from">
            <span class="label-text"><svg aria-hidden="true"><use href="#icon-note"></use></svg>From</span>
            <span class="optional">optional</span>
          </label>
          <input id="letter-from" type="text" placeholder="A quiet onlooker, Solitary…" maxlength="60" autocomplete="off">
        </div>
      </div>

      <div class="field field--body">
        <div class="field__header">
          <label for="letter-body">
            <span class="label-text"><svg aria-hidden="true"><use href="#icon-quill"></use></svg>Type your Letter</span>
          </label>
          <div class="meta-counts">
            <span id="word-count">0 words</span>
            <span aria-hidden="true">•</span>
            <span id="char-count">0 characters</span>
          </div>
        </div>
        <div class="textarea-wrap">
          <textarea id="letter-body" rows="10" placeholder="Rest your hands upon the desk. Pour out the unspoken, unburden the kept secrets, speak to the stars or to the quiet nothingness. No one will judge. No one will reply…"></textarea>
        </div>
      </div>

      <div class="actions-row">
        <button type="button" id="btn-clear" class="btn btn--ghost">Clear</button>
        <button type="button" id="btn-seal" class="btn btn--wax">
          <span class="btn__seal-dot"><svg aria-hidden="true"><use href="#icon-seal"></use></svg></span>
          Seal with wax
        </button>
      </div>

    </div>
  </section>
</main>

<div class="modal-overlay" id="seal-modal" aria-hidden="true">
  <div class="seal-card" role="dialog" aria-modal="true" aria-labelledby="seal-title">
    <div class="wax-emblem"><svg aria-hidden="true"><use href="#icon-seal"></use></svg></div>
    <h2 id="seal-title">Sealed in Perpetuity</h2>
    <p>Your letter has been folded, sealed with hot wax, and sent into the void.</p>
    <div class="divider"></div>
    <span class="eyebrow-note">Waiting quietly on the Read page</span>
  </div>
</div>

<script src="storage.js"></script>
<script src="write.js"></script>
</body>
</html>
